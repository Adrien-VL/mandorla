[project]
name = "mandorla"
version = "0.1.0"
description = "Tree-structured diamond architecture for memory-efficient transformer training"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "torch>=2.5",
  "numpy>=2.0",
  "einops>=0.8",
  "tqdm>=4.66",
  "matplotlib>=3.9",
  "transformers>=5.12.1",
  "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
  "ipykernel>=6.0",
]
tracking = [
  "wandb>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mandorla"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py313"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
